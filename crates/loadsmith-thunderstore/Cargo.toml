[package]
name = "loadsmith-thunderstore"
version = "0.2.0"
edition = "2024"
description = "Thunderstore API client, index backends, and r2z format for the loadsmith mod-manager library"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Kesomannen/loadsmith"
documentation = "https://docs.rs/loadsmith-thunderstore"

[dependencies]
loadsmith-core = { workspace = true }
loadsmith-loader = { workspace = true }
loadsmith-install = { workspace = true }
loadsmith-registry = { workspace = true }
loadsmith-platform = { workspace = true }
loadsmith-util = { workspace = true }

serde = { workspace = true }
serde_yaml_ng = { workspace = true }
thunderstore = { workspace = true }
zip = { workspace = true }
thiserror = { workspace = true }
camino = { workspace = true }
tracing = { workspace = true }
walkdir = { workspace = true }
globset = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
rusqlite = { workspace = true }
chrono = { workspace = true }
semver = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true, features = ["blocking", "json", "gzip"] }
insta = { workspace = true }
