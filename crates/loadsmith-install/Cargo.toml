[package]
name = "loadsmith-install"
version = "0.3.1"
edition = "2024"
description = "Install, remove, and list mod files for the loadsmith mod-manager library"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Kesomannen/loadsmith"
documentation = "https://docs.rs/loadsmith-install"

[dependencies]
loadsmith-core = { workspace = true }
loadsmith-util = { workspace = true }

serde = { workspace = true }
globset = { workspace = true }
camino = { workspace = true }
zip = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
walkdir = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
