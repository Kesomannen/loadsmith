[package]
name = "loadsmith-manifest"
version = "0.3.0"
edition = "2024"
description = "Manifest and lockfile format, resolver, and profile state for the loadsmith mod-manager library"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Kesomannen/loadsmith"
documentation = "https://docs.rs/loadsmith-manifest"

[dependencies]
loadsmith-core = { workspace = true }
loadsmith-registry = { workspace = true }
loadsmith-thunderstore = { workspace = true }
loadsmith-install = { workspace = true }
loadsmith-util = { workspace = true }

camino = { workspace = true }
thunderstore = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
walkdir = { workspace = true }
semver = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
insta = { workspace = true }
blake3 = { workspace = true }
