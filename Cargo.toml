[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
camino = { version = "1.2.3", features = ["serde1"] }
chrono = { version = "0.4.45", features = ["serde"] }
globset = { version = "0.4.18", features = ["serde1"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
thiserror = "2.0.18"
tokio = "1.52.3"
toml = "1.1.2"
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }
zip = "8.6.0"
tempfile = "3.27.0"
walkdir = "2.5.0"
reqwest = { version = "0.13.4", features = ["json"] }
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "fmt",
    "json",
] }
anyhow = "1.0.102"
bytes = "1.12.0"
thunderstore = { path = "../thunderstore-client" }
serde_yaml_ng = { version = "0.10.0" }
uuid = { version = "1.23.4", features = ["serde"] }
insta = { version = "1.48.0", features = ["yaml"] }
semver = { version = "1.0.28", features = ["serde"] }
digest-io = "0.1.0"
blake3 = "1.8.5"
futures = "0.3.32"
parking_lot = "0.12.5"
rusqlite = { version = "0.40.1" }
steamlocate = "2.1.0"
open = "5.3.6"

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
